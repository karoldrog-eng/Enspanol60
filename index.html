<!doctype html><html lang="pl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#123b39"><meta name="description" content="ESPAÑOL 60 — 60 dni praktycznej nauki hiszpańskiego"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>ESPAÑOL 60</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#172d2b;background:#f6f8f5}*{box-sizing:border-box}body{margin:0}header{background:#123b39;color:white;padding:24px 20px 28px}main{max-width:780px;margin:auto;padding:20px 16px 80px}.wrap{max-width:780px;margin:auto}h1{margin:0;font-size:28px;letter-spacing:-.8px}h2{font-size:23px;margin:8px 0 12px}h3{font-size:17px;margin:0 0 8px}p{line-height:1.55}small,.muted{color:#657573}.tag{display:inline-block;font-size:12px;background:#dbede7;color:#18574b;padding:6px 10px;border-radius:99px;font-weight:700}.card{background:white;border:1px solid #e0e8e2;border-radius:18px;padding:19px;margin-bottom:15px;box-shadow:0 4px 16px #123b3908}.hero{background:#e4f2e9;border-color:#d3e9dc}.btn{background:#146a59;color:white;border:0;border-radius:12px;padding:13px 16px;font-size:15px;font-weight:700;cursor:pointer;min-height:46px}.btn.secondary{background:#e7f1ec;color:#165447}.btn.outline{background:white;color:#165447;border:1px solid #b9d4c8}.btn:disabled{opacity:.5;cursor:not-allowed}.actions{display:flex;flex-wrap:wrap;gap:9px;margin-top:15px}.bar{background:#dce9df;height:11px;border-radius:20px;overflow:hidden}.bar>div{height:100%;background:#238a71;transition:width .3s}.phrase{padding:15px 0;border-bottom:1px solid #e5ece7}.phrase:last-child{border:0}.es{font-size:21px;font-weight:700;color:#124c41}.pl{color:#657573;margin-top:5px}.prompt{font-size:22px;font-weight:700;margin:15px 0}.answer{font-size:19px;color:#145849;font-weight:700;background:#e7f3ed;border-radius:12px;padding:15px;margin:12px 0}input{font:inherit;border:1px solid #b8ccc2;border-radius:11px;padding:13px;width:100%;min-height:46px}.listbtn{display:block;text-align:left;width:100%;background:white;border:1px solid #e0e8e2;border-radius:13px;padding:14px;margin:8px 0;font-size:15px;cursor:pointer}.listbtn.done{border-left:5px solid #238a71}.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.stat{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stat>div{background:white;border-radius:13px;padding:13px;text-align:center}.stat strong{display:block;font-size:23px;color:#165447}.nav{display:flex;gap:8px;overflow:auto;margin:12px 0 0}.nav button{white-space:nowrap;background:#ffffff1c;color:white;border:1px solid #ffffff55;padding:9px 14px;border-radius:10px;font-weight:600}.nav button.active{background:white;color:#123b39}.hide{display:none!important}.note{font-size:13px;color:#60736b}#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#123b39;color:white;padding:12px 18px;border-radius:12px;display:none;max-width:90%;z-index:5}@media(min-width:650px){header{padding-top:32px}main{padding-top:28px}.card{padding:24px}}
</style></head><body><header><div class="wrap"><div class="row"><div><div style="opacity:.8;font-size:12px;letter-spacing:2px">TWÓJ KURS HISZPAŃSKIEGO</div><h1>ESPAÑOL 60 <span style="font-size:24px">☀</span></h1></div><span style="font-size:12px">🇪🇸 España</span></div><nav class="nav" aria-label="Nawigacja"><button onclick="go('home')" id="nav-home">Start</button><button onclick="go('lessons')" id="nav-lessons">60 lekcji</button><button onclick="go('review')" id="nav-review">Powtórki</button><button onclick="go('settings')" id="nav-settings">Ustawienia</button></nav></div></header><main id="app"></main><div id="toast" role="status"></div><script>
let lessons=[],view='home',day=1,idx=0,stage='learn',revealed=false,heard=false,score=0,order=[];const KEY='espanol60-v1';let state={done:[],cards:{},streak:0,last:'',goal:45};try{state={...state,...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch(e){};const save=()=>localStorage.setItem(KEY,JSON.stringify(state));const $=s=>document.querySelector(s);const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function toast(t){let el=$('#toast');el.textContent=t;el.style.display='block';setTimeout(()=>el.style.display='none',2600)}function speak(t){if(!('speechSynthesis'in window)){toast('Brak syntezatora mowy w tej przeglądarce');return}speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='es-ES';u.rate=.82;let voices=speechSynthesis.getVoices();let v=voices.find(x=>x.lang.toLowerCase()==='es-es')||voices.find(x=>x.lang.startsWith('es'));if(v)u.voice=v;speechSynthesis.speak(u)}function listen(target){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){toast('Rozpoznawanie mowy niedostępne. Użyj wpisywania odpowiedzi.');return}let r=new SR();r.lang='es-ES';r.interimResults=false;r.onresult=e=>{let t=e.results[0][0].transcript;$('#spoken').textContent='Rozpoznano: '+t;$('#typed').value=t};r.onerror=e=>toast('Mikrofon: '+e.error);r.start();toast('Mów teraz po hiszpańsku…')}function normalize(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[¿?¡!.,]/g,'').replace(/\s+/g,' ').trim()}function go(v){view=v;render()}function start(d){day=d;idx=0;stage='learn';revealed=false;score=0;order=[0,1,2,3].sort(()=>Math.random()-.5);view='lesson';render()}function mark(k,correct){let c=state.cards[k]||{level:0,due:0};c.level=correct?Math.min(c.level+1,5):0;let days=[1,1,3,7,14,30];c.due=Date.now()+days[c.level]*86400000;state.cards[k]=c;save()}function complete(){if(!state.done.includes(day))state.done.push(day);state.last=new Date().toISOString().slice(0,10);save();view='result';render()}function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+view));let app=$('#app');let done=state.done.length;let next=lessons.find(l=>!state.done.includes(l.day))||lessons[59];if(view==='home'){app.innerHTML=`<div class="card hero"><span class="tag">Twój plan na dziś</span><h2>Dzień ${next.day}: ${esc(next.title)}</h2><p>4 zwroty • słuchanie • aktywne przypominanie • test • wymowa</p><button class="btn" onclick="start(${next.day})">Rozpocznij lekcję →</button></div><div class="stat"><div><strong>${done}/60</strong><small>ukończone</small></div><div><strong>${Math.round(done/60*100)}%</strong><small>postęp</small></div><div><strong>${state.goal}</strong><small>min/dzień</small></div></div><div class="card" style="margin-top:15px"><h3>Twój kurs</h3><div class="bar"><div style="width:${done/60*100}%"></div></div><p class="muted">Cel: rozmawiać w Hiszpanii w sklepie, restauracji, hotelu i podczas podróży. Uczysz się codziennie, a nie tylko czytasz.</p><button class="btn secondary" onclick="go('review')">Powtórz poznane zwroty</button></div><div class="card"><h3>Jak pracować?</h3><p>Najpierw słuchaj i powtarzaj na głos. Potem odpowiadaj bez podpowiedzi. Mów nawet wtedy, gdy nie jesteś pewien. Po każdej lekcji wróć do powtórek.</p><p class="note">Wersja darmowa: nie wymaga konta ani płatnego API. Głos i mikrofon zależą od możliwości telefonu i przeglądarki.</p></div>`}
else if(view==='lessons'){app.innerHTML=`<h2>Wszystkie 60 lekcji</h2><p class="muted">Możesz wracać do dowolnego dnia. Zielony pasek oznacza ukończoną lekcję.</p>${lessons.map(l=>`<button class="listbtn ${state.done.includes(l.day)?'done':''}" onclick="start(${l.day})"><div class="row"><span><b>Dzień ${l.day}</b> · ${esc(l.title)}</span><span>${state.done.includes(l.day)?'✓':'→'}</span></div></button>`).join('')}`}
else if(view==='lesson'){let l=lessons[day-1],p=l.phrases[idx];if(stage==='learn'){app.innerHTML=`<div class="row"><span class="tag">Dzień ${day} / 60</span><span class="muted">Etap 1/2 · Nauka</span></div><h2>${esc(l.title)}</h2><div class="card"><p class="muted">Posłuchaj każdego zdania i powtórz je 3 razy na głos. Następnie przejdź do testu bez podpowiedzi.</p>${l.phrases.map((x,i)=>`<div class="phrase"><div class="row"><div><div class="es">${esc(x.es)}</div><div class="pl">${esc(x.pl)}</div></div><button class="btn secondary" aria-label="Odtwórz wymowę" onclick="speak(lessons[${day-1}].phrases[${i}].es)">▶</button></div></div>`).join('')}<div class="actions"><button class="btn" onclick="stage='test';idx=0;render()">Przejdź do ćwiczeń →</button></div></div>`}else{let q=l.phrases[order[idx]];app.innerHTML=`<div class="row"><span class="tag">Dzień ${day} / 60</span><span class="muted">Etap 2/2 · ${idx+1}/4</span></div><h2>Powiedz to po hiszpańsku</h2><div class="card"><div class="bar"><div style="width:${idx/4*100}%"></div></div><p class="muted">Przetłumacz z pamięci i powiedz odpowiedź na głos.</p><div class="prompt">${esc(q.pl)}</div><input id="typed" placeholder="Wpisz lub podyktuj po hiszpańsku" autocomplete="off" autocapitalize="off"><p class="note" id="spoken">Mikrofon jest opcjonalny.</p><div class="actions"><button class="btn secondary" onclick="listen()">🎤 Mów</button><button class="btn secondary" onclick="speak(lessons[${day-1}].phrases[order[idx]].es)">▶ Posłuchaj wzorca</button></div><div id="feedback"></div><div class="actions"><button class="btn" onclick="check()" id="check">Sprawdź</button><button class="btn outline" onclick="reveal()">Pokaż odpowiedź</button></div></div>`}}
else if(view==='result'){app.innerHTML=`<div class="card hero"><span class="tag">Lekcja ukończona</span><h2>¡Muy bien! 🎉</h2><p>Ukończyłeś dzień ${day}: ${esc(lessons[day-1].title)}.</p><p>Wynik: <b>${score}/4</b> odpowiedzi ocenionych jako poprawne. Rozpoznawanie zdań jest uproszczone — liczy się również to, czy umiesz powiedzieć je na głos.</p><div class="actions"><button class="btn" onclick="start(${Math.min(60,day+1)})">Następna lekcja →</button><button class="btn secondary" onclick="go('review')">Powtórki</button></div></div>`}
else if(view==='review'){let items=[];for(let l of lessons)if(state.done.includes(l.day))for(let j=0;j<4;j++){let k=l.day+'-'+j,c=state.cards[k];if(!c||c.due<=Date.now())items.push({k,p:l.phrases[j]})}app.innerHTML=`<h2>Powtórki</h2><p class="muted">Zwroty wracają po 1, 3, 7, 14 i 30 dniach. Odpowiadaj z pamięci.</p><div class="card"><h3>Do powtórzenia: ${items.length}</h3>${items.length?`<button class="btn" onclick="reviewStart()">Rozpocznij powtórkę</button>`:'<p>Na teraz wszystko gotowe. Wróć jutro albo rozpocznij kolejną lekcję.</p>'}</div>`;window.reviewItems=items}
else if(view==='reviewing'){let it=window.reviewItems[window.reviewIndex];app.innerHTML=`<span class="tag">Powtórka ${window.reviewIndex+1}/${window.reviewItems.length}</span><div class="card"><p>Powiedz po hiszpańsku:</p><div class="prompt">${esc(it.p.pl)}</div><div id="revealed"></div><div class="actions"><button class="btn secondary" onclick="speak(window.reviewItems[window.reviewIndex].p.es)">▶ Posłuchaj</button><button class="btn" onclick="showReview()">Pokaż odpowiedź</button></div><div id="rate"></div></div>`}
else if(view==='settings'){app.innerHTML=`<h2>Ustawienia i kopia postępów</h2><div class="card"><label for="goal"><b>Dzienny cel</b></label><select id="goal" style="display:block;margin:12px 0;padding:12px;border-radius:9px" onchange="state.goal=+this.value;save()"><option value="30" ${state.goal===30?'selected':''}>30 minut</option><option value="45" ${state.goal===45?'selected':''}>45 minut</option><option value="60" ${state.goal===60?'selected':''}>60 minut</option></select><p class="note">Czas jest celem orientacyjnym, nie automatycznym pomiarem aktywności.</p><button class="btn secondary" onclick="exportData()">Pobierz kopię postępów</button><p class="note">Postępy są zapisywane tylko w tej przeglądarce. Usunięcie jej danych może je skasować.</p><input type="file" id="import" accept="application/json" onchange="importData(this)"><p class="note">Możesz przywrócić wcześniej pobraną kopię.</p></div>`}}
function check(){let q=lessons[day-1].phrases[order[idx]],typed=$('#typed').value.trim();if(!typed){toast('Najpierw wpisz lub powiedz odpowiedź');return}let ok=normalize(typed)===normalize(q.es);if(ok)score++;mark(day+'-'+order[idx],ok);$('#feedback').innerHTML=`<div class="answer">${ok?'✓ Poprawnie!':'Wzorcowa odpowiedź:'}<br>${esc(q.es)}</div><p class="note">${ok?'Świetnie!':'Porównaj swoją odpowiedź z wzorcem. Inne poprawne sformułowania mogą nie zostać rozpoznane.'}</p>`;$('#check').outerHTML='<button class="btn" onclick="nextQ()">Dalej →</button>'}function reveal(){let q=lessons[day-1].phrases[order[idx]];$('#feedback').innerHTML=`<div class="answer">${esc(q.es)}</div><p class="note">Powtórz zdanie trzy razy na głos.</p>`;mark(day+'-'+order[idx],false);$('#check').outerHTML='<button class="btn" onclick="nextQ()">Dalej →</button>'}function nextQ(){idx++;if(idx>=4)complete();else render()}function reviewStart(){if(!window.reviewItems?.length)return;window.reviewIndex=0;view='reviewing';render()}function showReview(){let it=window.reviewItems[window.reviewIndex];$('#revealed').innerHTML=`<div class="answer">${esc(it.p.es)}</div>`;$('#rate').innerHTML='<div class="actions"><button class="btn secondary" onclick="rateReview(false)">Jeszcze nie umiem</button><button class="btn" onclick="rateReview(true)">Umiem ✓</button></div>'}function rateReview(ok){mark(window.reviewItems[window.reviewIndex].k,ok);window.reviewIndex++;if(window.reviewIndex>=window.reviewItems.length){toast('Powtórka ukończona');go('review')}else render()}function exportData(){let b=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='espanol60-postepy.json';a.click();URL.revokeObjectURL(a.href)}function importData(el){let f=el.files[0];if(!f)return;f.text().then(t=>{try{let x=JSON.parse(t);if(!Array.isArray(x.done)||typeof x.cards!=='object')throw Error();state=x;save();toast('Przywrócono postępy');go('home')}catch(e){toast('Nieprawidłowy plik kopii')}})}fetch('lessons.json').then(r=>{if(!r.ok)throw Error();return r.json()}).then(d=>{lessons=d;render()}).catch(()=>{$('#app').innerHTML='<div class="card">Nie można wczytać lekcji. Uruchom aplikację z hostingu HTTPS, a nie bezpośrednio z pliku HTML.</div>'});if('serviceWorker'in navigator)window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
</script></body></html>
